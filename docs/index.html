<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="description" content="Installable teacher launcher for the Attendance Dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Attendance Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #202124;
    }
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title {
      font-weight: 700;
      flex: 1;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }
    .primary { background: #1a73e8; color: white; }
    .secondary { background: #eef3f8; color: #174ea6; }
    .danger { background: #d93025; color: white; }
    .content {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    iframe {
      border: 0;
      width: 100%;
      height: calc(100vh - 61px);
      background: white;
    }
    .setup {
      width: min(560px, calc(100% - 28px));
      margin: 48px auto;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(0,0,0,.10);
    }
    .setup h1 { margin-top: 0; }
    .setup p { color: #5f6368; line-height: 1.5; }
    label { display: block; text-align: left; font-weight: 650; margin: 20px 0 8px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #c9cdd2;
    }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    .row button { flex: 1; }
    .hint { font-size: 13px; color: #6f7378; margin-top: 8px; }
    .hidden { display: none !important; }
    .status {
      font-size: 13px;
      color: #5f6368;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .topbar { flex-wrap: wrap; }
      .title { min-width: 180px; }
      iframe { height: calc(100vh - 110px); }
      .setup { margin-top: 22px; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title">Attendance Dashboard</div>
    <span id="connectionStatus" class="status"></span>
    <button id="installButton" class="primary hidden">Install App</button>
    <button id="settingsButton" class="secondary hidden">Settings</button>
  </header>

  <main class="content">
    <section id="setupPanel" class="setup hidden" aria-labelledby="setupTitle">
      <h1 id="setupTitle">Connect your teacher dashboard</h1>
      <p>Paste the Google Apps Script Web App teacher URL. It is stored only in this browser.</p>

      <label for="teacherUrl">Teacher dashboard URL</label>
      <input id="teacherUrl" type="url" inputmode="url" autocomplete="off"
             placeholder="https://script.google.com/.../exec?teacher=1">
      <div class="hint">Use the deployed <strong>/exec?teacher=1</strong> URL, not /dev.</div>

      <div class="row">
        <button class="primary" onclick="saveTeacherUrl()">Save & Open</button>
        <button class="secondary" onclick="useExampleFormat()">Show URL format</button>
      </div>
    </section>

    <iframe id="dashboardFrame" class="hidden" title="Teacher attendance dashboard"
            allow="clipboard-read; clipboard-write"></iframe>
  </main>
</div>

<script>
const STORAGE_KEY = 'attendanceTeacherUrl';
let deferredInstallPrompt = null;

const setupPanel = document.getElementById('setupPanel');
const dashboardFrame = document.getElementById('dashboardFrame');
const teacherUrlInput = document.getElementById('teacherUrl');
const settingsButton = document.getElementById('settingsButton');
const installButton = document.getElementById('installButton');
const connectionStatus = document.getElementById('connectionStatus');

function normalizeTeacherUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';

  let url;
  try {
    url = new URL(raw);
  } catch (error) {
    return '';
  }

  if (!url.hostname.endsWith('script.google.com')) {
    return '';
  }

  if (!url.pathname.endsWith('/exec')) {
    return '';
  }

  url.searchParams.set('teacher', '1');
  return url.toString();
}

function loadSavedTeacherUrl() {
  const saved = localStorage.getItem(STORAGE_KEY) || '';
  if (saved) {
    openDashboard(saved);
  } else {
    showSetup();
  }
}

function saveTeacherUrl() {
  const normalized = normalizeTeacherUrl(teacherUrlInput.value);

  if (!normalized) {
    alert('Please enter a valid Apps Script /exec URL.');
    teacherUrlInput.focus();
    return;
  }

  localStorage.setItem(STORAGE_KEY, normalized);
  openDashboard(normalized);
}

function openDashboard(url) {
  setupPanel.classList.add('hidden');
  dashboardFrame.classList.remove('hidden');
  settingsButton.classList.remove('hidden');
  dashboardFrame.src = url;
  connectionStatus.textContent = navigator.onLine ? 'Online' : 'Offline';
}

function showSetup() {
  dashboardFrame.classList.add('hidden');
  dashboardFrame.removeAttribute('src');
  setupPanel.classList.remove('hidden');
  settingsButton.classList.add('hidden');
  teacherUrlInput.value = localStorage.getItem(STORAGE_KEY) || '';
}

function useExampleFormat() {
  teacherUrlInput.value = 'https://script.google.com/a/macros/YOUR-DOMAIN/s/YOUR-DEPLOYMENT-ID/exec?teacher=1';
  teacherUrlInput.focus();
  teacherUrlInput.select();
}

settingsButton.addEventListener('click', showSetup);

window.addEventListener('online', () => {
  connectionStatus.textContent = 'Online';
  if (!dashboardFrame.classList.contains('hidden') && dashboardFrame.src) {
    dashboardFrame.src = dashboardFrame.src;
  }
});

window.addEventListener('offline', () => {
  connectionStatus.textContent = 'Offline';
});

window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.classList.remove('hidden');
});

installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.classList.add('hidden');
});

window.addEventListener('appinstalled', () => {
  installButton.classList.add('hidden');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

loadSavedTeacherUrl();
</script>
</body>
</html>
